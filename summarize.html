<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f8fc">
    <title>Summarize your text - mini-txt</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #101828;
            --muted: #667085;
            --blue: #2563eb;
            --blue-dark: #1745b0;
            --green: #15966a;
            --line: #e5eaf1;
            --background: #f5f8fc;
        }

        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            margin: 0;
            color: var(--ink);
            background: var(--background);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        a { color: inherit; text-decoration: none; }
        .shell { max-width: 1030px; margin: 0 auto; padding: 0 30px; }
        .topbar { height: 78px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(16, 24, 40, .07); }
        .brand { display: inline-flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 750; letter-spacing: -.6px; }
        .brand-mark { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 11px; color: white; background: linear-gradient(145deg, #3478f6, #1454d1); }
        .back-link { display: inline-flex; align-items: center; gap: 8px; color: #667085; font-size: 13px; font-weight: 600; transition: color .18s ease; }
        .back-link:hover { color: var(--blue); }

        main { max-width: 760px; margin: 0 auto; padding: 52px 0 72px; }
        .eyebrow { display: inline-flex; align-items: center; gap: 8px; color: var(--green); font-size: 11px; font-weight: 750; letter-spacing: .12em; text-transform: uppercase; }
        .eyebrow-dot { width: 7px; height: 7px; border-radius: 50%; background: #22a875; box-shadow: 0 0 0 3px #d8f4e8; }
        h1 { margin: 12px 0 8px; font-size: clamp(32px, 5vw, 43px); letter-spacing: -1.8px; }
        .intro { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.65; }

        .workspace { margin-top: 29px; padding: 24px; border: 1px solid var(--line); border-radius: 18px; background: #fff; box-shadow: 0 12px 34px rgba(24, 45, 80, .06); }
        .field-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 11px; }
        label { font-size: 13px; font-weight: 700; }
        .word-count { color: #8a94a5; font-size: 11px; }
        textarea {
            width: 100%;
            min-height: 225px;
            padding: 16px;
            resize: vertical;
            border: 1px solid #dfe5ed;
            border-radius: 12px;
            outline: none;
            color: var(--ink);
            background: #fcfdff;
            font: inherit;
            font-size: 14px;
            line-height: 1.7;
            transition: border-color .18s ease, box-shadow .18s ease, background .18s ease;
        }

        textarea::placeholder { color: #a4acb9; }
        textarea:focus { border-color: #80a9ff; background: #fff; box-shadow: 0 0 0 4px rgba(37, 99, 235, .09); }
        .form-footer { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 16px; }
        .privacy-note { display: flex; align-items: center; gap: 7px; color: #798394; font-size: 11px; }
        .primary-button {
            min-height: 45px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            padding: 0 16px;
            border: 0;
            border-radius: 10px;
            color: white;
            background: var(--blue);
            box-shadow: 0 5px 12px rgba(37, 99, 235, .18);
            font: inherit;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: background .18s ease, transform .18s ease;
        }

        .primary-button:hover:not(:disabled) { transform: translateY(-1px); background: var(--blue-dark); }
        .primary-button:focus-visible, .back-link:focus-visible { outline: 3px solid rgba(37, 99, 235, .35); outline-offset: 3px; }
        .primary-button:disabled { cursor: wait; opacity: .7; }
        .result-card { margin-top: 18px; padding: 22px 24px; border: 1px solid #dceee5; border-radius: 16px; background: linear-gradient(145deg, #f3fbf7, #f8fbff); }
        .result-heading { display: flex; align-items: center; gap: 9px; color: #147551; font-size: 13px; font-weight: 750; }
        .result-content { min-height: 25px; margin: 12px 0 0; color: #475467; font-size: 14px; line-height: 1.75; white-space: pre-wrap; overflow-wrap: anywhere; }
        .result-content:empty::before { content: "Your summary will appear here."; color: #98a2b3; }
        .result-content[data-state="error"] { color: #b42318; }
        .result-content[data-state="loading"] { color: #667085; }
        .footer { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 19px 0 25px; border-top: 1px solid var(--line); color: #8a94a5; font-size: 11px; }
        .developer-link { display: inline-flex; align-items: center; gap: 7px; color: #475467; font-weight: 600; transition: color .18s ease; }
        .developer-link:hover { color: var(--blue); }
        .developer-link:focus-visible { outline: 3px solid rgba(37, 99, 235, .35); outline-offset: 3px; border-radius: 3px; }

        @media (max-width: 560px) {
            .shell { padding: 0 18px; }
            .topbar { height: 68px; }
            main { padding: 39px 0 50px; }
            .workspace { padding: 17px; }
            textarea { min-height: 190px; }
            .form-footer { align-items: flex-start; flex-direction: column; }
            .primary-button { width: 100%; }
            .result-card { padding: 18px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
        }
    </style>
</head>
<body>
    <div class="shell">
        <header class="topbar">
            <a class="brand" href="/" aria-label="mini-txt home">
                <span class="brand-mark" aria-hidden="true">
                    <svg width="19" height="19" viewBox="0 0 24 24" fill="none">                    <path d="M6 5.5h12M6 9.5h12M6 13.5h7M6 18.5h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                </span>
                mini-txt
            </a>
            <a class="back-link" href="/">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M19 12H5m7 7-7-7 7-7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
                Back to dashboard
            </a>
        </header>

        <main>
            <div class="eyebrow"><span class="eyebrow-dot"></span> YOUR FOCUSED WORKSPACE</div>
            <h1>Let's summarize.</h1>
            <p class="intro">Paste in an article, meeting notes, or any text you want to make easier to digest.</p>

            <section class="workspace" aria-label="Text to summarize">
                <form id="summarization-form">
                    <div class="field-heading">
                        <label for="dialogue-input">Your text</label>
                        <span class="word-count" id="word-count">0 words</span>
                    </div>
                    <textarea id="dialogue-input" placeholder="Paste or type your text here..." required></textarea>
                    <div class="form-footer">
                        <span class="privacy-note">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 10V7a5 5 0 0 1 10 0v3m-11 0h12a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
                            Text is processed by this app's local model.
                        </span>
                        <button class="primary-button" type="submit">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 5.75A1.75 1.75 0 0 1 7.75 4h8.5L19 6.75v11.5A1.75 1.75 0 0 1 17.25 20h-10.5A1.75 1.75 0 0 1 5 18.25V6.75A1.75 1.75 0 0 1 6.75 5H16m-7 7h6m-6 3h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
                            Summarize text
                        </button>
                    </div>
                </form>
            </section>

            <section class="result-card" aria-labelledby="result-heading">
                <div class="result-heading" id="result-heading">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 5.75A1.75 1.75 0 0 1 6.75 4h10.5A1.75 1.75 0 0 1 19 5.75v12.5A1.75 1.75 0 0 1 17.25 20H6.75A1.75 1.75 0 0 1 5 18.25V5.75Z" stroke="currentColor" stroke-width="1.8"/><path d="M8 8h8M8 12h8m-8 4h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
                    Your summary
                </div>
                <p class="result-content" id="summary-text" aria-live="polite"></p>
            </section>
        </main>
        <footer class="footer">
            <span>mini-txt · A little less text, a lot more focus.</span>
            <a class="developer-link" href="https://p-vijay.vercel.app" target="_blank" rel="noopener noreferrer" aria-label="Developer portfolio (opens in a new tab)">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm-7 8a7 7 0 0 1 14 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
                Developer
            </a>
        </footer>
    </div>

    <script>
        const form = document.getElementById("summarization-form");
        const dialogueInput = document.getElementById("dialogue-input");
        const summaryText = document.getElementById("summary-text");
        const submitButton = form.querySelector("button");
        const wordCount = document.getElementById("word-count");

        dialogueInput.addEventListener("input", () => {
            const words = dialogueInput.value.trim().split(/\s+/).filter(Boolean).length;
            wordCount.textContent = `${words} ${words === 1 ? "word" : "words"}`;
        });

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const dialogue = dialogueInput.value.trim();
            if (!dialogue) return;

            summaryText.dataset.state = "loading";
            summaryText.textContent = "Creating your summary...";
            submitButton.disabled = true;

            try {
                const response = await fetch("/summarize/", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ dialogue }),
                });

                if (!response.ok) {
                    throw new Error(`The server returned an error (${response.status}). Please try again.`);
                }

                const data = await response.json();
                summaryText.textContent = data.summary || "No summary was returned. Please try again.";
                delete summaryText.dataset.state;
            } catch (error) {
                summaryText.dataset.state = "error";
                summaryText.textContent = error instanceof Error
                    ? error.message
                    : "Something went wrong while creating your summary.";
            } finally {
                submitButton.disabled = false;
            }
        });
    </script>
</body>
</html>
